<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Petite Lavande tab icon — line-art lavender bundle (three separated
       stems, outline blossoms, slender base leaves) on a soft tile. -->
  <rect width="512" height="512" rx="104" fill="#F6F1E7"/>
  <g stroke="#241C13" fill="none" stroke-linecap="round">
    <!-- stems -->
    <g stroke-width="11">
      <path d="M256 466 C255 390 255 300 256 200" />
      <path d="M162 466 C166 400 172 320 178 224" />
      <path d="M360 468 C356 410 350 340 346 270" />
    </g>
    <!-- base leaves -->
    <g stroke-width="10">
      <path d="M250 466 C204 436 148 428 98 444" />
      <path d="M262 466 C306 438 360 434 414 452" />
      <path d="M246 468 C214 410 184 390 144 382" />
      <path d="M266 468 C298 412 330 396 372 392" />
    </g>
    <!-- center stem blossoms -->
    <g stroke-width="10">
      <ellipse cx="256" cy="52" rx="14" ry="21" />
      <ellipse cx="231" cy="92" rx="13" ry="19" transform="rotate(-36 231 92)" />
      <ellipse cx="281" cy="92" rx="13" ry="19" transform="rotate(36 281 92)" />
      <ellipse cx="229" cy="136" rx="13" ry="19" transform="rotate(-40 229 136)" />
      <ellipse cx="283" cy="136" rx="13" ry="19" transform="rotate(40 283 136)" />
      <ellipse cx="256" cy="172" rx="12" ry="17" />
    </g>
    <!-- left stem blossoms -->
    <g stroke-width="10">
      <ellipse cx="178" cy="88" rx="13" ry="20" transform="rotate(-6 178 88)" />
      <ellipse cx="155" cy="128" rx="12" ry="18" transform="rotate(-42 155 128)" />
      <ellipse cx="201" cy="124" rx="12" ry="18" transform="rotate(30 201 124)" />
      <ellipse cx="153" cy="170" rx="12" ry="18" transform="rotate(-45 153 170)" />
      <ellipse cx="199" cy="166" rx="12" ry="18" transform="rotate(32 199 166)" />
      <ellipse cx="176" cy="202" rx="11" ry="16" transform="rotate(-8 176 202)" />
    </g>
    <!-- right stem blossoms -->
    <g stroke-width="10">
      <ellipse cx="346" cy="136" rx="13" ry="20" transform="rotate(6 346 136)" />
      <ellipse cx="323" cy="176" rx="12" ry="18" transform="rotate(-32 323 176)" />
      <ellipse cx="369" cy="172" rx="12" ry="18" transform="rotate(42 369 172)" />
      <ellipse cx="321" cy="218" rx="12" ry="18" transform="rotate(-34 321 218)" />
      <ellipse cx="367" cy="214" rx="12" ry="18" transform="rotate(44 367 214)" />
      <ellipse cx="346" cy="250" rx="11" ry="16" transform="rotate(8 346 250)" />
